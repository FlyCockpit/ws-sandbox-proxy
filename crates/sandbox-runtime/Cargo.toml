[package]
name = "sandbox-runtime"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SandboxRuntime trait with the Incus KVM, fake and unsupported runtimes"

[dependencies]
getrandom = "0.4"
ring = "0.17.14"
sandbox-protocol = { path = "../sandbox-protocol" }
# Credential bundle v1 codec for credential pack/restore.
login-definition = { path = "../login-definition" }
# Owner-approved (CLI logins): wipes credential plaintext read from or sent to
# the guest helper. Already locked; `alloc` for `Zeroizing<Vec<u8>>`.
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# open-flag constants for the PTY input-queue drain
# (`O_NOCTTY | O_NONBLOCK` differ per architecture). Constants only: no FFI.
libc = "0.2.191"
nix.workspace = true
portable-pty.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `fs` for the PTY test that clears FD_CLOEXEC on a sentinel (safe `fcntl`).
nix = { workspace = true, features = ["fs"] }

[[bin]]
name = "incus-surface"
path = "src/bin/incus-surface.rs"

[lints]
workspace = true
