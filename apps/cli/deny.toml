# cargo-deny configuration — supply-chain guardrails enforced in CI.
# Run locally with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check only the targets this repo ships or builds, so a dependency that is
# compiled for no wssp build (for example a wasm32-only one) is out of scope.
# Sources:
#   x86_64-unknown-linux-musl, aarch64-unknown-linux-musl:
#     `targets` in apps/cli/dist-workspace.toml (the released binaries).
#   x86_64-unknown-linux-gnu:
#     the ubuntu-latest host of every cargo job in .github/workflows
#     (cli-ci.yml, release-preflight.yml, nightly-tooling.yml).
# Add a triple here whenever a workflow or the dist config gains one.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
# Fail on any crate with a known RUSTSEC security advisory.
version = 2
yanked = "deny"
# Add IDs here only with a written justification, e.g.:
# ignore = ["RUSTSEC-0000-0000"]  # reason: <why this is acceptable>
ignore = []

[licenses]
version = 2
# Allowlist of licenses your dependency tree may use. If a new dependency pulls
# in a license not listed here, CI fails — forcing a conscious decision rather
# than an accidental GPL/AGPL inclusion. Add licenses deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-roots (Mozilla's root certificate bundle as data). Permissive, no
    # copyleft; required by the daemon's rustls TLS stack.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Warn when multiple versions of the same crate are pulled in (bloat / slow
# builds). Not an error by default — bump to "deny" once your tree is clean.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; they are never published.
allow-wildcard-paths = true
# Crates you never want, with a reason:
# deny = [{ crate = "openssl", reason = "use rustls instead" }]
deny = []

[sources]
# Only allow crates from crates.io by default. Add git sources explicitly.
unknown-registry = "deny"
unknown-git = "deny"
