[workspace]
resolver = "2"
members = [
    "crates/login-definition",
    "crates/sandbox-protocol",
    "crates/sandbox-runtime",
    "apps/cli",
    "apps/cli/xtask",
]
# Vendored third-party crates are path patches, never members.
exclude = ["third_party"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Host PTY around the `incus exec -t` child only (MIT, wezterm).
portable-pty = { version = "0.9.0", default-features = false }

# Safe NSS lookup and process controls; MIT licensed.
# portable-pty uses nix 0.28 internally; our lookups and prctl calls do not
# exchange nix types with it, so this dependency can track current releases.
[workspace.dependencies.nix]
version = "0.31.3"
default-features = false
features = ["user"]

# russh 0.65.2 with one small patch (consumption-driven per-channel receive
# windows for `wssp ssh --stdio`): `third_party/russh-0.65.2.patch`, checked
# against the published crate by `cargo xtask vendored-russh --check`.
[patch.crates-io]
russh = { path = "third_party/russh-0.65.2" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dist]
inherits = "release"
