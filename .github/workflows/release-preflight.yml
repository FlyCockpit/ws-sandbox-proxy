# Pre-release gate for the companion Rust CLI (`apps/cli`). Called by
# release.yml before any artifacts are built; runs the same checks as cli-ci.yml
# in one job so a release can never ship from a red tree.
name: Release Preflight

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/cli

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo xtask sync-docs --check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # cargo-deny 0.20 takes --config before the subcommand.
          arguments: --config apps/cli/deny.toml
          command-arguments: ""
          manifest-path: apps/cli/Cargo.toml
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # Pinned with cli-ci.yml's typos job.
          tool: typos-cli@1.52.0
      # Typos and the policy checks run from the repo root, as in cli-ci.yml:
      # the root _typos.toml and scripts/policy-checks.sh cover the whole tree.
      - run: typos
        working-directory: .
      # The destructive-operation scanner parses with @babel/parser.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: bash scripts/policy-checks.sh
        working-directory: .
