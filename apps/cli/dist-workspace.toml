[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
installers = ["shell"]
# Ship notices for the statically linked libc and other bundled dependencies,
# and the full Apache-2.0 text the (modified) russh notice refers to.
# apps/cli/tests/dist_notices.rs checks that every file named here exists.
include = ["../../THIRD-PARTY-LICENSES.md", "../../licenses/Apache-2.0.txt"]
# Target platforms to build apps for (Rust target-triple syntax). The CLI and
# node daemon are Linux-only.
targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The root manual Release workflow consumes this config from the monorepo root.
# Pull-request cargo-dist runs are plan-only when generated locally.
pr-run-mode = "plan"
# Release requests must pass the root release-preflight workflow before
# artifacts build.
plan-jobs = ["./release-preflight"]

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"

[dist.github-custom-runners]
x86_64-unknown-linux-musl = "ubuntu-latest"
# GitHub has no ubuntu-latest arm64 runner label; builds are native static musl.
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
global = "ubuntu-latest"
