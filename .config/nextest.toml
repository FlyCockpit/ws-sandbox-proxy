[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

# Fixtures use per-test temp dirs / PID-scoped paths and ephemeral loopback
# ports. Process-wide state is isolated by nextest's process-per-test model;
# no cross-process resource currently requires a serial test group.

# DNS fault cases include 125s + 95s phases and 300s convergence budgets;
# journal capacity tests fsync thousands of receipts. Warn every minute,
# allowing those deliberate workloads before terminating a hung test at 10m.

# cargo nextest run --profile ci ... writes target/nextest/ci/junit.xml.
[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
